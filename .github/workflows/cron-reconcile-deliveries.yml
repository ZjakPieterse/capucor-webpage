name: Cron — signed-proposal fulfilment and email retries

# Web-standalone phase 3 (2026-10-07). Finishes signed-proposal fulfilment
# (signed PDF to Drive, the client and owner "signed" emails) and resends failed
# funnel emails (leads, POPIA data requests, proposals) under their original
# idempotency keys. Replaces capucor-os's cron-email-reconciliation.yml, which
# must be disabled before this first runs: it does not know the new
# `proposal.signed_*` events and would fail them permanently.
#
# Why an Action and not the Worker: Workers Free allows 10 ms CPU and 50
# subrequests per request; a full fulfilment needs more of both. Zero
# dependencies BY DESIGN — checkout + setup-node + one .mjs, no `npm ci`.
#
# ⚠️ This repository is public, so this job's logs are public. The script logs
# ids, event types, counts and error codes only. Keep it that way.

on:
  schedule:
    # 07:00–17:50 SAST, Monday to Friday: a client who has just signed is
    # waiting on the "signed" email, and ten-minute latency is the point.
    - cron: '*/10 5-15 * * 1-5'
    # Hourly, every day. THIS is the tier declared in the web contract's
    # scheduledWorkflows, because it bounds the worst case: without it a send
    # that failed at 18:00 on a Friday would wait until Monday. Hourly rather
    # than denser because the backoff runs from 10 minutes to a 6-hour ceiling.
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: reconcile-deliveries
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Reconcile fulfilment and email delivery
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_NOTIFICATION_EMAIL: zjak@capucor.com
        run: node scripts/reconcile-deliveries.mjs
