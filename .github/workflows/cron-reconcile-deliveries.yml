name: Cron — signed-proposal fulfilment and email retries

# Web-standalone phase 3 (2026-10-07). Finishes signed-proposal fulfilment
# (signed PDF to Drive, the client and owner "signed" emails) and resends failed
# funnel emails (leads, POPIA data requests, proposals) under their original
# idempotency keys. It is the only retry runner for funnel emails (the old
# portal-side runner was disabled at this workflow's release, 2026-10-07).
#
# Why an Action and not the Worker: Workers Free allows 10 ms CPU and 50
# subrequests per request; a full fulfilment needs more of both. Zero
# dependencies BY DESIGN — checkout + setup-node + one .mjs, no `npm ci`.
#
# ⚠️ This repository is public, so this job's logs are public. The script logs
# ids, event types, counts and error codes only. Keep it that way.

on:
  schedule:
    # 08:05–17:55 SAST (06:05–15:55 UTC), Monday to Friday, every ten minutes:
    # a client who has just signed is waiting on "That's signed", and the first
    # retry is due 10 minutes after a failed attempt. Dropped on 2026-10-08 and
    # restored on 2026-10-13, after a first PDF attempt timed out
    # (FT-2026-10-0004) and the client email waited on the hourly run. Off the
    # hour on purpose: it never lands on the hourly run, and GitHub delays
    # scheduled runs most at :00.
    - cron: '5,15,25,35,45,55 6-15 * * 1-5'
    # Hourly, every day: bounds the worst case outside business hours. Hourly
    # rather than denser because the backoff runs from 10 minutes to a 6-hour
    # ceiling. Dispatch it by hand if a client is waiting.
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: reconcile-deliveries
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Reconcile fulfilment and email delivery
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_NOTIFICATION_EMAIL: zjak@capucor.com
        run: node scripts/reconcile-deliveries.mjs
