name: Cron — signed-proposal fulfilment and email retries

# Web-standalone phase 3 (2026-10-07). Finishes signed-proposal fulfilment
# (signed PDF to Drive, the client and owner "signed" emails) and resends failed
# funnel emails (leads, POPIA data requests, proposals) under their original
# idempotency keys. It is the only retry runner for funnel emails (the old
# portal-side runner was disabled at this workflow's release, 2026-10-07).
#
# Why an Action and not the Worker: Workers Free allows 10 ms CPU and 50
# subrequests per request; a full fulfilment needs more of both. Zero
# dependencies BY DESIGN — checkout + setup-node + one .mjs, no `npm ci`.
#
# ⚠️ This repository is public, so this job's logs are public. The script logs
# ids, event types, counts and error codes only. Keep it that way.
#
# Business-hours loop (2026-10-17). GitHub drops most scheduled runs: from 10 to
# 17 October only 45 of ~470 scheduled runs started, with gaps of up to four
# hours in business hours. A job that has started is not dropped, so a run that
# starts in weekday business hours (06:00–16:00 UTC, 08:00–18:00 SAST) stays up
# and runs the script every ten minutes until 16:00 UTC or for 5 h 30 min,
# whichever is first. The ten-minute crons are now only triggers: the first one
# GitHub honours starts a loop, later ones see the loop and do a single pass.
# Outside the loop window every run is a single pass. Since 2026-11-02 the
# weekday window opens at 00:00 UTC and a capped loop hands over (below).
#
# Handover and early start (2026-11-02). Still left ~2-4 h gaps: a loop that hit
# its 5 h 30 min cap mid-afternoon waited for a trigger GitHub might drop, and on
# some days no trigger started before 10:30 SAST. Now (1) a loop that ends at its
# cap before 16:00 UTC dispatches its own successor (a workflow_dispatch from
# GITHUB_TOKEN does start a run; needs actions: write), and (2) the loop window
# opens at 00:00 UTC (02:00 SAST) on weekdays: on 10 of 11 weekdays 19 Oct-2 Nov
# GitHub started an hourly run between 00:00 and 06:00 UTC, so the chain is
# usually up before the working day starts, with no outside trigger or token.

on:
  schedule:
    # Every ten minutes, 08:05–17:55 SAST (06:05–15:55 UTC), Monday to Friday.
    # Each is a chance to start the business-hours loop (or restart it after its
    # 5 h 30 min cap); while a loop runs, a run that lands does one pass and ends.
    # Off the hour on purpose: GitHub delays and drops scheduled runs most at :00.
    - cron: '5,15,25,35,45,55 6-15 * * 1-5'
    # Hourly, every day: bounds the worst case outside business hours. Hourly
    # rather than denser because the backoff runs from 10 minutes to a 6-hour
    # ceiling. At :17, off the hour, for the same reason. Dispatch it by hand if
    # a client is waiting: in business hours with no loop running, a dispatch
    # starts the loop; otherwise it is a single pass.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: 'Loop for this many minutes regardless of the time (blank = normal behaviour). For testing.'
        required: false
        default: ''
      after_run:
        description: 'Set by a loop handing over at its cap: the run id this run takes over from (blank = none).'
        required: false
        default: ''

# No concurrency group: a queued run would wait behind a five-hour loop. Runs
# may overlap briefly; the script claims each item by compare-and-swap with a
# lease, so two passes never work the same row.

permissions:
  contents: read
  actions: write # gh run list (is a loop running?) and gh workflow run (handover)

jobs:
  reconcile:
    runs-on: ubuntu-latest
    # Covers the 5 h 30 min loop cap plus one pass; GitHub's ceiling is 6 h.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Reconcile fulfilment and email delivery
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_NOTIFICATION_EMAIL: zjak@capucor.com
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LOOP_MINUTES: ${{ inputs.loop_minutes || '' }}
          AFTER_RUN: ${{ inputs.after_run || '' }}
          SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          set -uo pipefail
          PASS_SECONDS=600          # one pass every ten minutes
          MAX_LOOP_SECONDS=19800    # 5 h 30 min, inside timeout-minutes
          PASS_TIMEOUT=240          # a hung pass cannot eat the next slot
          IDLE_WARN_DAYS=45         # GitHub disables crons after 60 idle days

          failed=0
          now=$(date -u +%s)

          # Public repo: GitHub disables every scheduled workflow here after 60
          # days without activity, silently. Fail loudly well before that, but
          # only on hourly-cron and dispatched runs: a few emails a day, not one
          # per ten-minute trigger.
          idle_days=$(( (now - $(git log -1 --format=%ct)) / 86400 ))
          if [ "$idle_days" -ge "$IDLE_WARN_DAYS" ]; then
            echo "::error::No commit for $idle_days days. GitHub disables this repo's scheduled workflows (retries, lead prune, proposal expiry) after 60 days without activity. Push any commit to master to reset the clock."
            [ "$SCHEDULE" != '5,15,25,35,45,55 6-15 * * 1-5' ] && failed=1
          fi

          # Decide how long to run: a single pass by default.
          end=$now
          if [ -n "$LOOP_MINUTES" ]; then
            if ! [[ "$LOOP_MINUTES" =~ ^[0-9]+$ ]]; then
              echo "::error::loop_minutes must be a whole number of minutes."
              exit 1
            fi
            end=$(( now + 10#$LOOP_MINUTES * 60 ))
          elif [ "$(date -u +%u)" -le 5 ] && [ "$(date -u +%-H)" -lt 16 ]; then
            end=$(date -u -d 'today 16:00' +%s)
          fi
          capped=0
          if [ "$end" -gt $(( now + MAX_LOOP_SECONDS )) ]; then
            end=$(( now + MAX_LOOP_SECONDS ))
            capped=1
          fi
          [[ "$AFTER_RUN" =~ ^[0-9]*$ ]] || AFTER_RUN=''

          # One loop at a time: if an older run of this workflow is still in
          # progress, it is the loop, so this run does a single pass. If the
          # lookup fails, loop anyway; overlapping passes are safe.
          if [ "$end" -gt "$now" ]; then
            older=$(gh run list --workflow cron-reconcile-deliveries.yml --status in_progress --limit 20 \
              --json databaseId --jq "[.[] | select(.databaseId < $GITHUB_RUN_ID and .databaseId != ${AFTER_RUN:-0})] | length" 2>/dev/null || echo 0)
            if [ "${older:-0}" -gt 0 ]; then
              echo "An earlier run is still in progress (the loop); this run does a single pass."
              end=$now
              capped=0
            else
              echo "Looping every $((PASS_SECONDS / 60)) minutes until $(date -u -d "@$end" +%H:%M) UTC."
            fi
          fi

          pass=0
          while :; do
            pass=$((pass + 1))
            started=$(date -u +%s)
            echo "::group::Pass $pass ($(date -u +%H:%M) UTC)"
            # A failed pass ends the run at once, so it goes red and GitHub
            # emails now, not hours later; the next ten-minute trigger GitHub
            # honours starts a fresh loop. The script imports two .ts files
            # (Node strips the types); the flag only silences the notice that
            # package.json declares no module type.
            if ! timeout "$PASS_TIMEOUT" node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/reconcile-deliveries.mjs; then
              echo "::endgroup::"
              echo "::error::Pass $pass failed or timed out; ending this run so the failure is reported now."
              failed=1
              break
            fi
            echo "::endgroup::"
            next=$(( started + PASS_SECONDS ))
            [ "$next" -ge "$end" ] && break
            sleep $(( next - $(date -u +%s) ))
          done

          echo "$pass pass(es) done."

          # Handover: a loop stopped by its cap (not by 16:00 UTC, a failure or a
          # test loop) starts its successor, which ignores this run when it looks
          # for a running loop. If the dispatch fails, the triggers still restart it.
          if [ "$failed" -eq 0 ] && [ "$capped" -eq 1 ] && [ -z "$LOOP_MINUTES" ] \
            && [ "$(date -u +%s)" -lt "$(date -u -d 'today 16:00' +%s)" ]; then
            if gh workflow run cron-reconcile-deliveries.yml --ref "$GITHUB_REF_NAME" -f after_run="$GITHUB_RUN_ID"; then
              echo "Loop cap reached; dispatched the next loop."
            else
              echo "::warning::Loop cap reached but the handover dispatch failed; the next trigger GitHub honours restarts the loop."
            fi
          fi
          exit "$failed"
