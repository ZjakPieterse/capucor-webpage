name: CI

# VALIDATION ONLY. This workflow cannot deploy.
#
# ADR 0010 part 1 (2026-08-20) removed the Deploy step and the two post-deploy
# checks from this file and moved them to `deploy.yml`, which runs on manual
# dispatch only. Before that change, a push to `master` (or `main`) shipped
# capucor.com straight to production with no human approval anywhere in the
# path, on the repository where signing and debit-order mandates happen.
#
# ⚠️ DO NOT ADD A DEPLOY STEP HERE. The separation is the control. If you
# need something to happen at deploy time, it belongs in `deploy.yml`.
#
# The build still runs, because a build failure is a validation failure worth
# catching on a pull request. What no longer happens is `wrangler deploy`.
#
# See capucor-os/docs/adr/0010-capucor-webpage-visibility-and-deployment-governance.md
# and capucor-os/docs/adr/0003-ci-validation-and-deployment-separation.md.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    runs-on: ubuntu-latest

    # Env lives at the job level (not on the Build step) so it is inherited by
    # every step AND every child process — including the `next build` that
    # OpenNext spawns as a grandchild via execSync('npm run build'). A
    # step-scoped env can fail to reach that grandchild; the job scope cannot.
    # NEXT_PUBLIC_SUPABASE_URL is consumed at build time (CSP in next.config.ts
    # + inlined into the client bundle); if it is empty the deployed login page
    # silently breaks. See the post-build assertion below, which fails the run
    # before deploy if the value did not get baked into the bundle.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      OWNER_NOTIFICATION_EMAIL: zjak@capucor.com
      NEXT_PUBLIC_BOOKING_URL: ${{ secrets.NEXT_PUBLIC_BOOKING_URL }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build (Cloudflare)
        run: npm run build:cf

      # Hard gate before deploy: prove the Supabase env actually reached the
      # build. A missing value ships a site whose every funnel form 500s.
      #
      # This used to additionally grep .open-next/assets/_next/static for the
      # Supabase host, proving the URL was inlined into the CLIENT bundle. That
      # assertion was removed in Phase 3 of the OS split and must not be
      # restored here: this repo no longer has a browser Supabase client (it
      # went to capucor-os with /login), so every Supabase call is server-side
      # and the host is correctly absent from the client bundle. The grep would
      # now fail 100% of the time. The bundle-inlining gate still exists, armed
      # and meaningful, in the capucor-os repo — that is where login lives.
      - name: Assert Supabase env reached the build
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL is empty in the CI env — the secret is not wired up. Failing validation."
            exit 1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is empty in the CI env — provision-on-sign would fail at signing. Failing validation."
            exit 1
          fi
          echo "✓ Supabase env present for the build."

